<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="50" fill="#E8E8E8"/>
  
  <!-- 币种符号 -->
  <g transform="translate(50, 50)">
    <!-- 外圆 -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#999" stroke-width="2"/>
    
    <!-- 内圆 -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#999" stroke-width="1.5"/>
    
    <!-- 问号 -->
    <text x="0" y="12" font-size="32" font-weight="bold" fill="#999" text-anchor="middle" font-family="Arial, sans-serif">?</text>
  </g>
</svg>

