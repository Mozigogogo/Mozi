<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mozi 套利雷达</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060B14;--surface:#0D1526;--card:#111D30;--border:#1E2D45;--border-lit:#2A3E5E;
  --accent:#00CCA0;--accent-dim:rgba(0,204,160,.1);--accent-glow:rgba(0,204,160,.35);
  --warn:#F59E0B;--warn-dim:rgba(245,158,11,.1);
  --danger:#EF4444;--pos:#10B981;
  --t1:#E8EDF5;--t2:#8B9CB5;--t3:#4E6080;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',sans-serif;
  --display:'Space Grotesk',sans-serif;
  --r:10px;--rs:6px;--ease:200ms cubic-bezier(.4,0,.2,1)
}
html{font-family:var(--sans);font-size:14px;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:rgba(6,11,20,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 28px;gap:28px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:17px;color:var(--t1);cursor:pointer;text-decoration:none;flex-shrink:0}
.logo-icon{width:26px;height:26px;position:relative}
.logo-icon svg{width:26px;height:26px}
.nav{display:flex;gap:2px}
.nbtn{padding:6px 14px;border-radius:var(--rs);font-size:13px;font-weight:500;border:none;cursor:pointer;background:transparent;color:var(--t2);transition:all var(--ease)}
.nbtn:hover{color:var(--t1);background:var(--surface)}
.nbtn.on{color:var(--accent);background:var(--accent-dim)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.delay{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--t3)}
.d-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dotpulse 2.4s ease infinite}
@keyframes dotpulse{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--accent-glow)}60%{opacity:.6;box-shadow:0 0 0 5px transparent}}
.btn{padding:7px 16px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--t1);transition:all var(--ease)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-p{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.btn-p:hover{background:#00e5b5;border-color:#00e5b5;color:#000}

/* MAIN */
.main{max-width:1080px;margin:0 auto;padding:28px 24px 80px}
.view{animation:vin .28s cubic-bezier(.4,0,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* TABS */
.type-tabs{display:flex;gap:0;margin-bottom:22px;border-bottom:1px solid var(--border)}
.ttab{padding:10px 20px;font-size:13px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all var(--ease)}
.ttab.on{color:var(--accent);border-bottom-color:var(--accent)}
.ttab:hover{color:var(--t1)}

/* TABLE */
.tbl-wrap{border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{padding:11px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;background:var(--surface);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--t2)}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--ease)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.03)}
tbody tr:hover .row-arrow{opacity:1}
td{padding:13px 16px;font-size:13px;vertical-align:middle;white-space:nowrap}
.td-num{color:var(--t3);font-family:var(--mono);font-size:12px;width:36px}
.sym-cell{display:flex;align-items:center;gap:9px}
.sym-ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sym-name{font-weight:600;font-size:14px}
.sym-sub{font-size:11px;color:var(--t3);margin-top:1px}
.exbadge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:600;border:1px solid}
.mono{font-family:var(--mono)}
.ann{font-family:var(--mono);font-weight:600;font-size:13px}
.ann-h{color:var(--accent)}
.ann-m{color:var(--t1)}
.ann-l{color:var(--t3)}
.stars{display:flex;gap:2px}
.s-on{color:var(--warn);font-size:11px}
.s-off{color:var(--border-lit);font-size:11px}
.warn-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;background:var(--warn-dim);border:1px solid rgba(245,158,11,.25);color:var(--warn);font-size:10px;font-weight:600;vertical-align:middle}
.row-arrow{color:var(--t3);font-size:12px;opacity:0;transition:opacity var(--ease)}
.load-more{width:100%;padding:13px;text-align:center;font-size:12px;color:var(--t2);border:none;background:var(--surface);cursor:pointer;transition:all var(--ease);border-top:1px solid var(--border)}
.load-more:hover{color:var(--accent);background:var(--accent-dim)}

/* LABEL INTRO (onboarding strip) */
.intro-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.intro-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;animation:vin .3s ease both}
.intro-card:nth-child(2){animation-delay:.05s}.intro-card:nth-child(3){animation-delay:.1s}.intro-card:nth-child(4){animation-delay:.15s}
.intro-icon{font-size:20px;margin-bottom:8px}
.intro-label{font-size:12px;font-weight:600;color:var(--t1);margin-bottom:4px}
.intro-desc{font-size:11px;color:var(--t3);line-height:1.6}
@media(max-width:700px){.intro-strip{grid-template-columns:1fr 1fr}}

/* DETAIL */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rs);background:var(--surface);border:1px solid var(--border);color:var(--t2);font-size:12px;cursor:pointer;transition:all var(--ease);margin-bottom:22px}
.back-btn:hover{color:var(--t1);border-color:var(--t3)}
.det-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.det-left{}
.det-ttl{font-family:var(--display);font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px}
.det-meta{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.cntd{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2)}
.cntd-val{font-family:var(--mono);font-size:11px;color:var(--t1);background:var(--surface);padding:2px 7px;border-radius:3px;border:1px solid var(--border)}
.det-right{text-align:right}
.fund-big{font-family:var(--mono);font-size:40px;font-weight:700;color:var(--accent);line-height:1}
.fund-sub{font-size:11px;color:var(--t2);margin-top:5px}
.fund-ann{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--t1);margin-top:4px}

/* CHART */
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px}
.chart-card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.chart-title{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
.chart-legend{display:flex;gap:14px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3)}
.leg-dot{width:8px;height:8px;border-radius:50%}
.chart-svg-wrap{position:relative}
.c-tooltip{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:7px 10px;font-family:var(--mono);font-size:11px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:10;color:var(--t1)}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:660px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.card-t{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.met-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.met-row:last-child{border-bottom:none}
.met-l{font-size:12px;color:var(--t2)}
.met-v{font-family:var(--mono);font-size:13px;font-weight:500}
.chg-up{color:var(--pos)}.chg-dn{color:var(--danger)}

/* CALCULATOR */
.calc-card{background:var(--card);border:1px solid var(--accent-dim);border-radius:var(--r);padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.calc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent)}
.calc-t{font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.inp-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.inp-g{flex:1;min-width:130px}
.inp-lbl{font-size:11px;color:var(--t3);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.inp-wrap{position:relative}
.inp-pfx{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3);font-family:var(--mono);font-size:12px;pointer-events:none}
.inp-f{width:100%;padding:8px 10px 8px 22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);color:var(--t1);font-family:var(--mono);font-size:13px;transition:border-color var(--ease);outline:none}
.inp-f:focus{border-color:var(--accent)}
.inp-f.np{padding-left:10px}
.pbtns{display:flex;gap:4px}
.pbtn{flex:1;padding:8px 4px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);color:var(--t2);font-size:12px;cursor:pointer;transition:all var(--ease);text-align:center}
.pbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.pbtn:hover{border-color:var(--border-lit);color:var(--t1)}
.steps-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:14px}
.step-row{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.step-row:last-child{border-bottom:none}
.step-n{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#000;font-size:10px;font-weight:700;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.step-txt{font-size:12px;color:var(--t2);flex:1}
.step-amt{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--t1)}
.res-table{border:1px solid var(--border);border-radius:var(--rs);overflow:hidden}
.res-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);transition:background .3s}
.res-row:last-child{border-bottom:none}
.res-row.tot{background:rgba(0,204,160,.08)}
.res-l{font-size:12px;color:var(--t2)}
.res-v{font-family:var(--mono);font-size:13px;font-weight:600}
.res-v.p{color:var(--pos)}.res-v.n{color:var(--danger)}.res-v.tot{color:var(--accent);font-size:15px}
.flash{animation:flashbg .4s ease}
@keyframes flashbg{0%{background:rgba(0,204,160,.18)}100%{background:transparent}}

/* RISK */
.risk-box{background:rgba(245,158,11,.05);border:1px solid rgba(245,158,11,.18);border-radius:var(--r);padding:15px 18px;margin-bottom:14px}
.risk-t{font-size:11px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.risk-li{font-size:12px;color:var(--t2);padding:4px 0;padding-left:14px;position:relative;line-height:1.6}
.risk-li::before{content:'•';position:absolute;left:0;color:var(--warn)}

.disc{font-size:11px;color:var(--t3);padding:10px 14px;background:var(--surface);border-radius:var(--rs);border:1px solid var(--border);line-height:1.7;margin-bottom:14px}

/* SUB VIEW */
.stitle{font-family:var(--display);font-size:20px;font-weight:700;margin-bottom:5px}
.ssub{font-size:13px;color:var(--t2);margin-bottom:24px}
.scard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:14px}
.scard-t{font-size:13px;font-weight:600;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.tags-wrap{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:500;cursor:pointer;transition:all var(--ease)}
.tag.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.tag:hover{border-color:var(--border-lit)}
.tag-add{border-style:dashed;color:var(--t3)}
.tag-add:hover{border-color:var(--t3);color:var(--t2)}
.thr-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.thr-row:last-child{border-bottom:none}
.thr-l{font-size:13px;color:var(--t2)}
.thr-r{display:flex;align-items:center;gap:8px}
.thr-inp{width:72px;padding:6px 8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);color:var(--t1);font-family:var(--mono);font-size:13px;text-align:right;outline:none;transition:border-color var(--ease)}
.thr-inp:focus{border-color:var(--accent)}
.thr-u{font-size:11px;color:var(--t3);width:24px}
.ch-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.ch-row:last-child{border-bottom:none}
.ch-l{display:flex;align-items:center;gap:10px}
.ch-ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.ch-name{font-size:13px;font-weight:500}
.ch-note{font-size:11px;color:var(--t3);margin-top:1px}
.coming{font-size:10px;color:var(--t3);background:var(--surface);border:1px solid var(--border);padding:2px 7px;border-radius:4px}
/* Toggle */
.tgl{position:relative;width:36px;height:20px;cursor:pointer;display:flex;align-items:center;flex-shrink:0}
.tgl input{opacity:0;width:0;height:0;position:absolute}
.tgl-track{position:absolute;inset:0;background:var(--border);border-radius:10px;transition:background var(--ease)}
.tgl input:checked~.tgl-track{background:var(--accent)}
.tgl-thumb{position:absolute;height:14px;width:14px;left:3px;top:3px;background:white;border-radius:50%;transition:transform var(--ease)}
.tgl input:checked~.tgl-thumb{transform:translateX(16px)}
.save-bar{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

/* TG preview */
.tg-wrap{background:#17212B;border-radius:12px;padding:14px;max-width:320px}
.tg-msg{background:#2B5278;border-radius:8px 8px 8px 0;padding:12px 14px;font-size:12px;line-height:1.8;color:#E8EDF5}
.tg-time{font-size:10px;color:#5B8DB8;text-align:right;margin-top:6px}
.tg-btn{display:inline-block;margin-top:10px;padding:7px 14px;background:rgba(0,204,160,.15);border:1px solid rgba(0,204,160,.35);border-radius:6px;color:var(--accent);font-size:12px;text-decoration:none;cursor:pointer;transition:background var(--ease)}
.tg-btn:hover{background:rgba(0,204,160,.25)}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;z-index:999;background:var(--card);border:1px solid var(--accent);border-radius:var(--r);padding:12px 16px;font-size:13px;display:none;align-items:center;gap:8px;box-shadow:0 4px 24px rgba(0,0,0,.5);animation:toastin .3s ease}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* HELP TOOLTIP */
.tip{position:relative;display:inline-flex}
.tip-ico{width:14px;height:14px;border-radius:50%;background:var(--surface);border:1px solid var(--border-lit);color:var(--t3);font-size:9px;cursor:help;display:flex;align-items:center;justify-content:center}
.tip-txt{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:8px 10px;font-size:11px;color:var(--t2);white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.5);z-index:50;font-weight:400;pointer-events:none;line-height:1.5;max-width:220px;white-space:normal;width:200px}
.tip:hover .tip-txt{display:block}
</style>
</head>
<body>

<header class="hdr">
  <a class="logo" onclick="nav('radar')">
    <div class="logo-icon">
      <svg viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="13" cy="13" r="12" stroke="#1E2D45" stroke-width="1.5"/>
        <circle cx="13" cy="13" r="8" stroke="#2A3E5E" stroke-width="1"/>
        <circle cx="13" cy="13" r="4" stroke="#2A3E5E" stroke-width="1"/>
        <circle cx="13" cy="13" r="1.5" fill="#00CCA0"/>
        <line x1="13" y1="13" x2="13" y2="2" stroke="#00CCA0" stroke-width="1.5" stroke-linecap="round" style="transform-origin:13px 13px;animation:sweep 3s linear infinite"/>
        <style>@keyframes sweep{to{transform:rotate(360deg)}}</style>
        <path d="M13 13 L20 6" stroke="#00CCA0" stroke-width="1" stroke-opacity=".3" stroke-linecap="round"/>
      </svg>
    </div>
    Mozi
  </a>
  <nav class="nav">
    <button class="nbtn on" id="nav-radar" onclick="nav('radar')">套利雷达</button>
    <button class="nbtn" id="nav-sub" onclick="nav('sub')">我的订阅</button>
  </nav>
  <div class="hdr-r">
    <div class="delay">
      <div class="d-dot"></div>
      <span>延迟 <span id="delay-val">38</span>s</span>
    </div>
    <button class="btn btn-p" onclick="showToast('✅ 登录功能即将开放')">登录</button>
  </div>
</header>

<main class="main" id="main"></main>

<div id="toast">
  <span id="toast-txt"></span>
</div>

<script>
// ===== DATA =====
const ops = [
  {rank:1,sym:'SOL',exchange:'Bybit',funding:0.025,period:8,ann:27.4,avg30:0.015,days:8,rating:4,warn:false,oi:124,oi24h:-3.2,oi7d:8.5,basis:0.12,perp:145.20,spot:145.03},
  {rank:2,sym:'WIF',exchange:'Binance',funding:0.085,period:8,ann:93.1,avg30:0.040,days:2,rating:2,warn:true,oi:38,oi24h:12.4,oi7d:65.3,basis:0.21,perp:2.847,spot:2.841},
  {rank:3,sym:'PEPE',exchange:'OKX',funding:0.045,period:8,ann:49.3,avg30:0.020,days:5,rating:4,warn:false,oi:92,oi24h:-1.8,oi7d:4.2,basis:0.08,perp:0.00001541,spot:0.00001540},
  {rank:4,sym:'ORDI',exchange:'Bybit',funding:0.032,period:8,ann:35.0,avg30:0.018,days:3,rating:4,warn:false,oi:21,oi24h:2.3,oi7d:-1.1,basis:0.15,perp:31.42,spot:31.37},
  {rank:5,sym:'BTC',exchange:'Binance',funding:0.018,period:8,ann:19.7,avg30:0.012,days:12,rating:5,warn:false,oi:4821,oi24h:-0.8,oi7d:3.1,basis:0.06,perp:61240,spot:61203},

// 30d fake funding history
function makeFundingHistory(baseRate) {
  const pts = [];
  let v = baseRate * 0.8;
  for(let i=0;i<30;i++){
    v += (Math.random()-.45)*baseRate*.4;
    v = Math.max(0.001, Math.min(baseRate*2.2, v));
    pts.push(parseFloat(v.toFixed(5)));
  }
  pts[29] = baseRate;
  return pts;
}

// ===== CHART =====
function initChart() {
  const svg = document.getElementById('fchart');
  if(!svg) return;
  const o = selectedOp;
  const hist = makeFundingHistory(o.funding);
  const W=700,H=160,px=20,py=16;
  const min=Math.min(...hist)*.8, max=Math.max(...hist)*1.1;
  const range=max-min;
  const xStep=(W-px*2)/(hist.length-1);
  const toY=v=>py+(1-(v-min)/range)*(H-py*2);
  const pts=hist.map((v,i)=>({x:px+i*xStep,y:toY(v),v}));

  // Smooth path using bezier
  let d=`M${pts[0].x},${pts[0].y}`;
  for(let i=1;i<pts.length;i++){
    const cx=(pts[i-1].x+pts[i].x)/2;
    d+=` C${cx},${pts[i-1].y} ${cx},${pts[i].y} ${pts[i].x},${pts[i].y}`;
  }

  const meanY=toY(o.avg30);
  const fillD=d+` L${pts[pts.length-1].x},${H} L${pts[0].x},${H} Z`;

  svg.innerHTML=`
    <defs>
      <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity=".35"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${fillD}" fill="url(#ag)"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="${px}" y1="${meanY}" x2="${W-px}" y2="${meanY}" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="6,4" opacity=".7"/>
    ${pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="transparent" class="hpt" data-i="${i}" data-v="${p.v.toFixed(5)}" data-x="${p.x}"/>`).join('')}
    <circle cx="${pts[pts.length-1].x}" cy="${pts[pts.length-1].y}" r="4" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>
  `;

  // Animate path
  const pathEl = svg.querySelector('path:nth-of-type(2)');
  if(pathEl){
    const len=pathEl.getTotalLength?.()|| 1000;
    pathEl.style.strokeDasharray=len;
    pathEl.style.strokeDashoffset=len;
    pathEl.style.transition='stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)';
    requestAnimationFrame(()=>{ pathEl.style.strokeDashoffset=0; });
  }

  // Hover
  const tip=document.getElementById('c-tooltip');
  svg.querySelectorAll('.hpt').forEach(el=>{
    el.addEventListener('mouseenter',function(){
      tip.style.opacity='1';
      tip.innerHTML=`<span style="color:var(--accent)">${this.dataset.v}%</span> <span style="color:var(--t3)">·</span> ${['6/1','6/2','6/3','6/4','6/5','6/6','6/7','6/8','6/9','6/10','6/11','6/12','6/13','6/14','6/15','6/16','6/17','6/18','6/19','6/20','6/21','6/22','6/23','6/24','6/25','6/26','6/27','6/28','6/29','今天'][+this.dataset.i]}`;
      const rect=svg.getBoundingClientRect();
      const elRect=this.getBoundingClientRect();
      tip.style.left=`${elRect.left-rect.left-tip.offsetWidth/2+8}px`;
      tip.style.top=`${elRect.top-rect.top-44}px`;
    });
    el.addEventListener('mouseleave',()=>{tip.style.opacity='0'});
  });
}

// ===== CALCULATOR =====
let currentPeriod = 30;

function setPeriod(d, el) {
  currentPeriod = d;
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  calcUpdate();
}

function calcUpdate() {
  const o = selectedOp;
  if(!o) return;
  const principal = parseFloat(document.getElementById('inp-principal')?.value)||10000;
  const period = currentPeriod;
  const costRate = parseFloat(document.getElementById('inp-rate')?.value)||10;

  const qty = (principal/o.spot).toFixed(2);
  const totalCapital = (principal*1.3).toFixed(0);
  const sessions = Math.floor(period*3);
  const fundingIncome = (principal * (o.funding/100) * sessions).toFixed(2);
  const fees = (principal*0.0004*2).toFixed(2);
  const costAmount = (principal*(costRate/100)*(period/365)).toFixed(2);
  const net = (parseFloat(fundingIncome)-parseFloat(fees)-parseFloat(costAmount)).toFixed(2);
  const netAnn = ((parseFloat(net)/principal)*(365/period)*100).toFixed(1);

  const stepsEl = document.getElementById('steps-box');
  if(stepsEl) {
    stepsEl.innerHTML=`
      <div class="step-row"><div class="step-n">1</div><div class="step-txt">${o.exchange} 现货买入 ${qty} 个 ${o.sym}</div><div class="step-amt">≈ $${principal.toLocaleString()}</div></div>
      <div class="step-row"><div class="step-n">2</div><div class="step-txt">${o.exchange} 永续合约做空 ${qty} ${o.sym}（1x 杠杆）</div><div class="step-amt">≈ $${principal.toLocaleString()}</div></div>
      <div class="step-row"><div class="step-n">3</div><div class="step-txt">总占用资金（含保证金）</div><div class="step-amt">≈ $${parseInt(totalCapital).toLocaleString()}</div></div>`;
  }

  const resEl = document.getElementById('res-table');
  if(resEl) {
    const rows = resEl.querySelectorAll('.res-row');
    rows.forEach(r=>r.classList.add('flash'));
    setTimeout(()=>rows.forEach(r=>r.classList.remove('flash')),400);
    resEl.innerHTML=`
      <div class="res-row"><div class="res-l">📥 Funding 收入（${period}天 × ${sessions}次结算）</div><div class="res-v p">+$${parseFloat(fundingIncome).toLocaleString()}</div></div>
      <div class="res-row"><div class="res-l">💸 手续费（开仓 + 平仓）</div><div class="res-v n">-$${fees}</div></div>
      <div class="res-row"><div class="res-l">🏦 资金机会成本（按 ${costRate}%/年）</div><div class="res-v n">-$${parseFloat(costAmount).toLocaleString()}</div></div>
      <div class="res-row tot"><div class="res-l" style="font-weight:600;color:var(--t1)">净收益 · ${period}天</div><div class="res-v tot">+$${parseFloat(net).toLocaleString()} <span style="font-size:12px;color:var(--t2)">（净年化 ${netAnn}%）</span></div></div>`;
  }
}

let cdInterval = null;
function startCountdown() {
  if(cdInterval) clearInterval(cdInterval);
  let s = 3*3600+22*60;
  function tick() {
    if(s<=0){s=8*3600}
    s--;
    const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
    const el=document.getElementById('cntd-val');
    if(el) el.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }
  cdInterval=setInterval(tick,1000);
}

      <div class="tag on">ETH <span style="font-size:10px;margin-left:2px;color:var(--t3)" onclick="event.stopPropagation();showToast('已移除 ETH')">×</span></div>
      <div class="tag on">SOL <span style="font-size:10px;margin-left:2px;color:var(--t3)" onclick="event.stopPropagation();showToast('已移除 SOL')">×</span></div>
      <div class="tag tag-add" onclick="showToast('搜索并添加标的')">+ 添加</div>
    </div>
  </div>

  <div class="scard">
    <div class="scard-t">关注交易所</div>
    <div class="tags-wrap">
      <div class="tag on" onclick="this.classList.toggle('on')">Binance</div>
      <div class="tag on" onclick="this.classList.toggle('on')">Bybit</div>
      <div class="tag" onclick="this.classList.toggle('on')">OKX</div>
      <div class="tag" onclick="this.classList.toggle('on')">Gate.io</div>
      <div class="tag" onclick="this.classList.toggle('on')">Bitget</div>
    </div>
  </div>

  <div class="scard">
    <div class="scard-t">推送阈值</div>
    <div class="thr-row">
      <div class="thr-l">Funding 年化 ≥ <span class="tip" style="margin-left:4px"><span class="tip-ico">?</span><span class="tip-txt">超过此年化时才推送，避免频繁打扰</span></span></div>
      <div class="thr-r"><input class="thr-inp" type="number" value="25"><span class="thr-u">%</span></div>
    </div>
    <div class="thr-row">
      <div class="thr-l">价差 ≥</div>
      <div class="thr-r"><input class="thr-inp" type="number" value="0.5" step="0.1"><span class="thr-u">%</span></div>
    </div>
    <div class="thr-row">
      <div class="thr-l">基差预警 ≥ <span class="tip" style="margin-left:4px"><span class="tip-ico">?</span><span class="tip-txt">基差超过此值时提醒你注意强平风险</span></span></div>
      <div class="thr-r"><input class="thr-inp" type="number" value="0.3" step="0.1"><span class="thr-u">%</span></div>
    </div>
    <div class="thr-row">
      <div class="thr-l">推送时段</div>
      <div class="thr-r" style="gap:6px;font-family:var(--mono);font-size:12px;color:var(--t2)">
        <input class="thr-inp" style="width:60px" value="08:00" type="time">
        <span>—</span>
        <input class="thr-inp" style="width:60px" value="23:59" type="time">
      </div>
    </div>
  </div>

  <div class="scard">
    <div class="scard-t">推送渠道</div>
    <div class="ch-row">
      <div class="ch-l">
        <div class="ch-ico" style="background:#1a3a5c">✈️</div>
        <div>
          <div class="ch-name">Telegram</div>
          <div class="ch-note" id="tg-status">未绑定 · <span style="color:var(--accent);cursor:pointer" onclick="bindTG()">点击绑定 Bot</span></div>
        </div>
      </div>
      <label class="tgl"><input type="checkbox" id="tg-tog" disabled><div class="tgl-track"></div><div class="tgl-thumb"></div></label>
    </div>
    <div class="ch-row" style="opacity:.5">
      <div class="ch-l">
        <div class="ch-ico" style="background:#1a3d1a">💬</div>
        <div>
          <div class="ch-name">微信</div>
          <div class="ch-note">即将开放</div>
        </div>
      </div>
      <span class="coming">即将开放</span>
    </div>
    <div class="ch-row" style="opacity:.5">
      <div class="ch-l">
        <div class="ch-ico" style="background:#1a1a3d">📧</div>
        <div>
          <div class="ch-name">邮件</div>
          <div class="ch-note">即将开放</div>
        </div>
      </div>
      <span class="coming">即将开放</span>
    </div>
  </div>

  <div class="scard">
    <div class="scard-t">TG 推送预览</div>
    <div class="tg-wrap">
      <div class="tg-msg">🚨 <strong>Funding 套利机会 #1</strong><br>────────────────<br>标的：<strong>SOL/USDT</strong><br>交易所：Bybit<br>当前：<strong>0.025%/8h</strong><br>年化：<strong>27.4%</strong>（↑ 为30日均值 1.7x）<br>基差：+0.12% · OI：$124M<br><br>💡 建议策略：Cash &amp; Carry<br>⚠️ 持续 8 天，可能均值回归</div>
      <div class="tg-time">刚刚</div>
      <a class="tg-btn" onclick="openDetail(ops[0]);nav('radar')">→ 查看详情</a>
    </div>
  </div>

  <div class="save-bar">
    <button class="btn" onclick="showToast('已重置为默认设置')">重置</button>
    <button class="btn btn-p" onclick="showToast('✅ 设置已保存')">保存设置</button>
  </div>`;
}

function bindTG() {
  const status = document.getElementById('tg-status');
  const tog = document.getElementById('tg-tog');
  if(status) status.innerHTML = '生成绑定码中…';
  setTimeout(()=>{
    if(status) status.innerHTML = '绑定码：<span style="font-family:var(--mono);color:var(--accent)">/bind M0Z1-4829</span> · 发送给 <a style="color:var(--accent)" href="#" onclick="return false">@MoziArbitBot</a>';
    if(tog) { tog.disabled=false; tog.checked=true; }
    showToast('✅ 请在 TG 内发送绑定码完成绑定');
  },1200);
}

// ===== ANIMATIONS =====
function animateRows() {
  document.querySelectorAll('tbody tr').forEach((tr,i)=>{
    tr.style.animationDelay=`${i*40}ms`;
  });
}

// ===== DELAY COUNTER =====
let delayVal = 38;
setInterval(()=>{
  delayVal = Math.max(12, Math.min(95, delayVal + Math.floor(Math.random()*10-4)));
  const el = document.getElementById('delay-val');
  if(el) el.textContent=delayVal;
},4000);

// ===== TOAST =====
function showToast(msg) {
  const t=document.getElementById('toast');
  document.getElementById('toast-txt').textContent=msg;
  t.style.display='flex';
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>{t.style.display='none'},2800);
}

// ===== INIT =====
render();
</script>
</body>
</html>
