# Nginx WebSocket 反向代理配置示例
# 将此配置添加到你的 Nginx 服务器配置中

server {
    listen 443 ssl http2;
    server_name moziinnovations.com;  # 改成你的域名

    # SSL 证书配置（可以使用 Let's Encrypt 免费证书）
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # WebSocket 代理配置
    location /ws {
        # 代理到后端 WebSocket 服务器（无需 SSL）
        proxy_pass http://43.134.34.51:8080/ws;
        
        # WebSocket 必需的头
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 长连接需要较长的超时时间
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # 其他 location 配置...
}

# 如果还没有 HTTP 跳转到 HTTPS 的配置，也添加上
server {
    listen 80;
    server_name moziinnovations.com;
    return 301 https://$server_name$request_uri;
}

